[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "showtime-cli"
version = "0.3.25"
description = "Command line show tracker using the TVMaze public API"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Evgeniy Vasilev", email = "aquilax@gmail.com"}]
keywords = ["tv", "commandline", "application", "show", "tvmaze"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "cmd2==4.2.2",
    "ratelimit==2.2.1",
    "tinydb==4.9.0",
    "terminaltables==3.1.10",
    "python-dateutil==2.9.0.post0",
    "typing-extensions==4.16.0",
]

[project.urls]
Homepage = "https://github.com/aquilax/showtime"
Repository = "https://github.com/aquilax/showtime"

[project.scripts]
showtime = "showtime.command:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ratelimit-stubs>=0.2",
    "types-python-dateutil>=2.8",
    "types-requests>=2.28",
    "tox>=4.0",
    "interrogate>=1.5",
]

[tool.setuptools]
packages = ["showtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = "tests/helpers"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["showtime"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
plugins = "tinydb.mypy_plugin"

[tool.ruff]
target-version = "py312"
line-length = 120
lint.select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
lint.ignore = [
    "E501",  # Line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["showtime"]

[tool.ruff.format]
line-length = 120

[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-module = false
fail-under = 95
exclude = ["setup.py", "docs"]
verbose = 0
quiet = false
